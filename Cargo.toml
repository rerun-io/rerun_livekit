[workspace]
resolver = "2"
members = [
    "crates/rerun_livekit",
]

[workspace.package]
authors = ["rerun.io <opensource@rerun.io>"]
edition = "2024"
homepage = "https://github.com/rerun-io/rerun_livekit"
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml"]
keywords = ["livekit", "rerun", "robotics", "teleoperation", "webrtc"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rerun-io/rerun_livekit"
rust-version = "1.98"


[workspace.dependencies]
# Rerun
re_protos = "=0.43.2"
rerun = { version = "=0.43.2", default-features = false, features = ["sdk"] }

# LiveKit
livekit = { version = "0.11.0", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.10.2", default-features = false, features = ["access-token"] }

# External
ahash = "0.8"
anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
env_logger = "0.11"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
itertools = "0.14"
log = "0.4"
parking_lot = "0.12"
prost = "0.14"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tonic = { version = "0.14", default-features = false, features = ["transport"] }


# ----------------------------------------------------------------------------------------
# Lints:

[workspace.lints.rust]
unsafe_code = "deny"

ambiguous_negative_literals = "warn"
deprecated_in_future = "warn"
elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
nonstandard_style = { level = "warn", priority = -1 }
redundant_imports = "warn"
redundant_lifetimes = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unexpected_cfgs = "warn"
unit_bindings = "warn"
unnameable_types = "warn"
unsafe_op_in_unsafe_fn = "warn" # `unsafe_op_in_unsafe_fn` may become the default in future Rust versions: https://github.com/rust-lang/rust/issues/71668
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

trivial_casts = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
all = "warn"
broken_intra_doc_links = "warn"
missing_crate_level_docs = "warn"

# See also clippy.toml
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # Rerun and LiveKit each bring their own versions of shared dependencies.
pedantic = { level = "warn", priority = -1 }

allow_attributes = "warn"
as_ptr_cast_mut = "warn"
await_holding_lock = "warn"
branches_sharing_code = "warn"
char_lit_as_u8 = "warn"
clear_with_drain = "warn"
clone_on_ref_ptr = "warn"
coerce_container_to_any = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
default_union_representation = "warn"
derive_partial_eq_without_eq = "warn"
disallowed_macros = "warn" # See clippy.toml
disallowed_methods = "warn" # See clippy.toml
disallowed_names = "warn" # See clippy.toml
disallowed_script_idents = "warn" # See clippy.toml
disallowed_types = "warn" # See clippy.toml
doc_include_without_cfg = "warn"
empty_enum_variants_with_brackets = "warn"
empty_line_after_outer_attr = "warn"
equatable_if_let = "warn"
exit = "warn"
fallible_impl_from = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
get_unwrap = "warn"
if_let_mutex = "warn"
implied_bounds_in_impls = "warn"
imprecise_flops = "warn"
infinite_loop = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
large_stack_frames = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
let_unit_value = "warn"
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
manual_clamp = "warn"
manual_ilog2 = "warn"
manual_ok_or = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
mem_forget = "warn"
missing_assert_message = "warn"
missing_enforced_import_renames = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_pass_by_ref_mut = "warn"
needless_type_cast = "warn"
negative_feature_names = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
only_used_in_recursion = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
print_stderr = "warn"
print_stdout = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
readonly_write_lock = "warn"
redundant_type_annotations = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
return_and_then = "warn"
self_named_module_files = "warn"
significant_drop_tightening = "warn"
set_contains_or_insert = "warn"
single_option_map = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_command_arg_space = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
too_long_first_doc_paragraph = "warn"
too_many_arguments = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unnecessary_struct_initialization = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_trait_names = "warn"
unwrap_used = "warn"
use_self = "warn"
useless_let_if_seq = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"

# Pedantic lints we opt out of, mirroring https://github.com/emilk/egui/blob/main/Cargo.toml.
# Lints that were already enabled here one-by-one are kept on.
cast_lossless = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
default_trait_access = "allow"
float_cmp = "allow"                          # exact float comparisons are usually intentional (`float_cmp_const` is still on)
inline_always = "allow"                      # we know what we are doing
items_after_statements = "allow"
many_single_char_names = "allow"             # `r, g, b, a` and `h, s, v` are fine
missing_panics_doc = "allow"
must_use_candidate = "allow"                 # too many hits
redundant_closure_for_method_calls = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"                      # too many false positives, e.g. `encoder`/`encoded`
struct_excessive_bools = "allow"
struct_field_names = "allow"
trivially_copy_pass_by_ref = "allow"
unreadable_literal = "allow"
used_underscore_binding = "allow"

manual_range_contains = "allow"       # this is better on 'allow'
map_unwrap_or = "allow"               # this is better on 'allow'
