# Pixi is a package management tool for developers.
# Before running a task, pixi ensures that all listed dependencies are installed first.
#
# Pixi is not required to build or run the bridge. It installs the linters that CI runs,
# and the `examples` environment that the MuJoCo robot and the smoke test run in.
#
# https://pixi.sh/latest/
#
# Use `pixi task list` to list the available tasks,
# and `pixi run TASK` to run it (e.g. `pixi run py-fmt`).

[workspace]
name = "rerun_livekit"
authors = ["rerun.io <opensource@rerun.io>"]
channels = ["conda-forge"]
description = "Bridge any Rerun stream through LiveKit"
homepage = "https://github.com/rerun-io/rerun_livekit"
license = "MIT OR Apache-2.0"

platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64", "win-64"]
readme = "README.md"
repository = "https://github.com/rerun-io/rerun_livekit"
version = "0.1.0"


[tasks]
# ------------------------------------------------------------------------------------------
# Python stuff:

# Run first ruff fix, then ruff format, order is important see also https://twitter.com/charliermarsh/status/1717229721954799727
py-fmt = "ruff check --fix --config pyproject.toml . && ruff format --config pyproject.toml ."
py-fmt-check = "ruff check --config pyproject.toml . && ruff format --check --config pyproject.toml"
py-lint = "mypy --install-types --non-interactive --no-warn-unused-ignore"

# ------------------------------------------------------------------------------------------
# General stuff:
lint-typos = "typos"


[dependencies]
# Python stuff:
mypy = "1.14.1.*"
ruff = "0.11.6.*"
gitpython = ">=3.1.40"

types-requests = ">=2.32,<3" # mypy type hint stubs for generate_changelog.py

# General stuff:
typos = ">=1.16.20"

[target.linux-64.dependencies]
sysroot_linux-64 = ">=2.17,<3" # rustc 1.64+ requires glibc 2.17+, see https://blog.rust-lang.org/2022/08/01/Increasing-glibc-kernel-requirements.html

[target.linux-aarch64.dependencies]
sysroot_linux-aarch64 = ">=2.17,<3" # rustc 1.64+ requires glibc 2.17+, see https://blog.rust-lang.org/2022/08/01/Increasing-glibc-kernel-requirements.html

# ------------------------------------------------------------------------------------------
# The Python that `examples/mujoco_robot.py` and `scripts/smoke_test.py` run in.

[feature.examples]
# `rerun-sdk` and `onnxruntime` publish no wheels for osx-64.
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "win-64"]

[feature.examples.dependencies]
python = "3.12.*"

[feature.examples.pypi-dependencies]
mujoco = ">=3.5,<4" # `mj_multiRay` takes `normal` since 3.5.
numpy = "*"
onnxruntime = "*"
pillow = "*"
rerun-sdk = { version = "==0.44.0", extras = ["catalog"] } # The MJCF importer needs 0.44.

[feature.examples.tasks]
mujoco-robot = "python examples/mujoco_robot.py"
register-episode = "python examples/register_episode.py"
smoke-test = "python scripts/smoke_test.py"

[environments]
examples = { features = ["examples"], no-default-feature = true }
