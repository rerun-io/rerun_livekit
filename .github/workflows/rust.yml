# Copied from https://github.com/rerun-io/rerun_template
on:
  push:
    branches:
      - "main"
  pull_request:
    types: [ opened, synchronize ]

name: Rust

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust-check:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rust-docs, clippy, rustfmt
          toolchain: 1.98
          override: true

      # LiveKit's prebuilt libwebrtc needs glib headers and clang 21 or newer to link against.
      # See https://github.com/livekit/rust-sdks#building-on-linux
      - name: Install packages (Linux)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y libglib2.0-dev libclang-21-dev pkg-config
          echo "CC=clang-21" >> "$GITHUB_ENV"
          echo "CXX=clang++-21" >> "$GITHUB_ENV"

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.84.2

      - name: Rustfmt
        run: pixi run cargo fmt --all -- --check

      - name: check --all-features
        run: pixi run cargo check --all-features --all-targets

      - name: check default features
        run: pixi run cargo check --all-targets

      - name: check --no-default-features
        run: pixi run cargo check --no-default-features --all-targets

      - name: Test doc-tests
        run: pixi run cargo test --doc --all-features

      - name: cargo doc --lib
        run: pixi run cargo doc --lib --no-deps --all-features

      - name: cargo doc --document-private-items
        run: pixi run cargo doc --document-private-items --no-deps --all-features

      - name: Build tests
        run: pixi run cargo build --tests --all-features

      - name: Run test
        run: pixi run cargo test --all-features

      - name: Clippy
        run: pixi run cargo clippy --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------

  cargo-deny:
    name: Check Rust dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        rust-version: "1.98"
        log-level: warn
        command: check
