[package]
authors.workspace = true
categories = ["network-programming", "science::robotics", "visualization"]
description = "Bridge any Rerun stream through LiveKit, for remote live viewing and teleoperation"
edition.workspace = true
homepage.workspace = true
include = ["LICENSE-APACHE", "LICENSE-MIT", "**/*.rs", "Cargo.toml", "example-rules.toml"]
keywords.workspace = true
license.workspace = true
name = "rerun_livekit"
publish = false
readme = "../../README.md"
repository.workspace = true
rust-version.workspace = true
version = "0.1.0"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]


[[bin]]
name = "rerun-livekit"
path = "src/bin/rerun-livekit/main.rs"


[dependencies]
# Rerun
re_protos.workspace = true
rerun.workspace = true

# LiveKit
livekit.workspace = true
livekit-token.workspace = true

# External
ahash.workspace = true
anyhow.workspace = true
bytes.workspace = true
clap.workspace = true
env_logger.workspace = true
futures-util.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
prost.workspace = true
rand.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
toml.workspace = true
tonic.workspace = true


[dev-dependencies]
crossterm.workspace = true
